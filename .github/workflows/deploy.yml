name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages, served on
# the custom domain tellniro.com (see public/CNAME). Runs on pushes to the
# feature branch and main, and can be triggered manually.
on:
  push:
    branches:
      - main
      - claude/niro-landing-page-5im4it
  workflow_dispatch:

# Required for GitHub Pages deployments via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Public origin for referral links; the pixel + waitlist endpoint are
          # optional and read from repo Variables so no code change is needed.
          NEXT_PUBLIC_SITE_ORIGIN: https://tellniro.com
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ vars.NEXT_PUBLIC_WAITLIST_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
