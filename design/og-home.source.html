<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0c1f18;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    color: #f6f1e7;
    padding: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  /* A single soft forest bloom, the same calm the page uses - no gradients
     across the card, nothing that reads as generic tech. */
  .bloom {
    position: absolute;
    right: -180px;
    top: -220px;
    width: 720px;
    height: 720px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(30,69,54,0.85) 0%, rgba(12,31,24,0) 68%);
  }
  .inner { position: relative; }
  /* The official logo file (ivory + gold, for dark grounds), never type. */
  .logo { display: block; height: 84px; width: auto; margin-left: -4px; }
  h1 {
    font-family: "Newsreader", Georgia, serif;
    font-size: 78px;
    line-height: 1.06;
    font-weight: 400;
    letter-spacing: -0.02em;
    max-width: 880px;
    margin-top: 52px;
  }
  .sub {
    font-size: 27px;
    line-height: 1.45;
    color: rgba(246,241,231,0.78);
    max-width: 760px;
    margin-top: 24px;
  }
  .rule { height: 1px; background: rgba(246,241,231,0.16); margin-bottom: 20px; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 20px;
    color: rgba(246,241,231,0.62);
  }
  .foot .site { color: #e0be84; font-weight: 500; }
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="inner">
    <img class="logo" src="../public/brand/niro-logo-dark.svg" alt="Niro">
    <h1>Your family&rsquo;s India assistant</h1>
    <p class="sub">Errands, bills, appointments and emergencies for your parents, and your own India paperwork too. All over WhatsApp.</p>
  </div>
  <div class="inner">
    <div class="rule"></div>
    <div class="foot">
      <span class="site">tellniro.com</span>
    </div>
  </div>
</body>
</html>
